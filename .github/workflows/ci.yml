name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: false
      - name: Test
        shell: bash
        run: |
          set +e
          go test ./... 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            output=$(tail -c 60000 test-output.txt)
            output=${output//'%'/'%25'}
            output=${output//$'\r'/'%0D'}
            output=${output//$'\n'/'%0A'}
            echo "::error title=go test failed::$output"
          fi
          exit "$status"
      - name: Vet
        run: go vet ./...
